name: Update gist

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Update gist from full commit history
        uses: actions/github-script@v9
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          TIMEZONE: Asia/Seoul
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const gistId = process.env.GIST_ID;
            const timeZone = process.env.TIMEZONE;

            // 1. 현재 사용자 확인
            const viewer = await github.graphql(`
              query {
                viewer {
                  login
                  id
                }
              }
            `);

            const username = viewer.viewer.login;
            const userId = viewer.viewer.id;

            core.info(`User: ${username}`);

            // 2. 내가 커밋한 모든 접근 가능한 저장소 수집
            let after = null;
            const repoMap = new Map();

            do {
              const result = await github.graphql(`
                query($login: String!, $after: String) {
                  user(login: $login) {
                    repositoriesContributedTo(
                      first: 100
                      after: $after
                      includeUserRepositories: true
                      contributionTypes: [COMMIT]
                    ) {
                      nodes {
                        name
                        nameWithOwner
                        isFork
                        owner {
                          login
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              `, {
                login: username,
                after
              });

              const connection =
                result.user.repositoriesContributedTo;

              for (const repo of connection.nodes) {
                if (!repo.isFork) {
                  repoMap.set(repo.nameWithOwner, repo);
                }
              }

              after = connection.pageInfo.hasNextPage
                ? connection.pageInfo.endCursor
                : null;

            } while (after);

            const repos = [...repoMap.values()];

            core.info(`Repositories found: ${repos.length}`);

            // 3. 각 저장소에서 과거 커밋을 끝까지 페이지네이션
            const committedDates = [];

            for (const repo of repos) {
              let commitCursor = null;

              do {
                try {
                  const result = await github.graphql(`
                    query(
                      $owner: String!
                      $name: String!
                      $userId: ID!
                      $after: String
                    ) {
                      repository(owner: $owner, name: $name) {
                        defaultBranchRef {
                          target {
                            ... on Commit {
                              history(
                                first: 100
                                after: $after
                                author: { id: $userId }
                              ) {
                                nodes {
                                  committedDate
                                }
                                pageInfo {
                                  hasNextPage
                                  endCursor
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `, {
                    owner: repo.owner.login,
                    name: repo.name,
                    userId,
                    after: commitCursor
                  });

                  const history =
                    result.repository
                      ?.defaultBranchRef
                      ?.target
                      ?.history;

                  if (!history) {
                    break;
                  }

                  for (const commit of history.nodes) {
                    committedDates.push(commit.committedDate);
                  }

                  commitCursor = history.pageInfo.hasNextPage
                    ? history.pageInfo.endCursor
                    : null;

                } catch (error) {
                  core.warning(
                    `Skipping ${repo.nameWithOwner}: ${error.message}`
                  );
                  break;
                }

              } while (commitCursor);
            }

            core.info(`Total commits found: ${committedDates.length}`);

            if (committedDates.length === 0) {
              core.setFailed("No commits found.");
              return;
            }

            // 4. 한국 시간 기준으로 시간대 분류
            let morning = 0;
            let daytime = 0;
            let evening = 0;
            let night = 0;

            const hourFormatter = new Intl.DateTimeFormat(
              "en-GB",
              {
                timeZone,
                hour: "2-digit",
                hourCycle: "h23"
              }
            );

            for (const date of committedDates) {
              const hour = Number(
                hourFormatter.format(new Date(date))
              );

              if (hour >= 6 && hour < 12) {
                morning++;
              } else if (hour >= 12 && hour < 18) {
                daytime++;
              } else if (hour >= 18 && hour < 24) {
                evening++;
              } else {
                night++;
              }
            }

            const total =
              morning + daytime + evening + night;

            // 5. 기존 productive-box와 같은 그래프 생성
            function generateBar(percent, size = 21) {
              const syms = "░▏▎▍▌▋▊▉█";
              const frac = Math.floor(
                (size * 8 * percent) / 100
              );
              const full = Math.floor(frac / 8);

              if (full >= size) {
                return "█".repeat(size);
              }

              const semi = frac % 8;

              return (
                "█".repeat(full) +
                syms.substring(semi, semi + 1)
              ).padEnd(size, "░");
            }

            const periods = [
              ["🌞 Morning", morning],
              ["🌆 Daytime", daytime],
              ["🌃 Evening", evening],
              ["🌙 Night", night]
            ];

            const lines = periods.map(([label, commits]) => {
              const percent = (commits / total) * 100;

              return [
                label.padEnd(10),
                `${String(commits).padStart(5)} commits`.padEnd(14),
                generateBar(percent),
                `${percent.toFixed(1).padStart(5)}%`
              ].join(" ");
            });

            // 6. 현재 Gist 읽기
            const gist = await github.rest.gists.get({
              gist_id: gistId
            });

            const oldFilename =
              Object.keys(gist.data.files)[0];

            const newFilename =
              morning + daytime > evening + night
                ? "I'm an early 🐤"
                : "I'm a night 🦉";

            // 7. Gist 업데이트
            await github.rest.gists.update({
              gist_id: gistId,
              files: {
                [oldFilename]: {
                  filename: newFilename,
                  content: lines.join("\n")
                }
              }
            });

            core.info(
              `Gist updated with ${total} historical commits 🎉`
            );
