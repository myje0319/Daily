name: Update gist

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Update gist
        uses: actions/github-script@v9
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          TIMEZONE: Asia/Seoul

        with:
          github-token: ${{ secrets.GH_TOKEN }}
          retries: 3

          script: |
            const gistId = process.env.GIST_ID;
            const timeZone = process.env.TIMEZONE;

            const me = await github.rest.users.getAuthenticated();
            const username = me.data.login;

            core.info(`User: ${username}`);

            const repoMap = new Map();

            // 1. 내가 소유한 저장소 전부 수집
            // fork 포함
            const ownedRepos = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              {
                affiliation: "owner",
                visibility: "all",
                per_page: 100
              }
            );

            for (const repo of ownedRepos) {
              repoMap.set(repo.full_name, {
                owner: repo.owner.login,
                name: repo.name,
                fullName: repo.full_name
              });
            }

            core.info(
              `Owned repositories: ${ownedRepos.length}`
            );

            // 2. 과거에 기여했던 외부 저장소도 추가
            const yearsResult = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionYears
                  }
                }
              }
            `, {
              login: username
            });

            const years =
              yearsResult.user
                .contributionsCollection
                .contributionYears;

            core.info(
              `Contribution years: ${years.join(", ")}`
            );

            for (const year of years) {
              const from = `${year}-01-01T00:00:00Z`;
              const to = `${year}-12-31T23:59:59Z`;

              try {
                const result = await github.graphql(`
                  query(
                    $login: String!
                    $from: DateTime!
                    $to: DateTime!
                  ) {
                    user(login: $login) {
                      contributionsCollection(
                        from: $from
                        to: $to
                      ) {
                        commitContributionsByRepository(
                          maxRepositories: 100
                        ) {
                          repository {
                            name
                            nameWithOwner
                            owner {
                              login
                            }
                          }
                        }
                      }
                    }
                  }
                `, {
                  login: username,
                  from,
                  to
                });

                const items =
                  result.user
                    .contributionsCollection
                    .commitContributionsByRepository;

                for (const item of items) {
                  const repo = item.repository;

                  if (repo) {
                    repoMap.set(repo.nameWithOwner, {
                      owner: repo.owner.login,
                      name: repo.name,
                      fullName: repo.nameWithOwner
                    });
                  }
                }

              } catch (error) {
                core.warning(
                  `Contribution lookup ${year}: ${error.message}`
                );
              }
            }

            const repos = [...repoMap.values()];

            core.info(
              `Total repositories to scan: ${repos.length}`
            );

            // 3. 실제 내 커밋 조회
            const commitMap = new Map();

            for (const repo of repos) {
              try {
                const commits = await github.paginate(
                  github.rest.repos.listCommits,
                  {
                    owner: repo.owner,
                    repo: repo.name,
                    author: username,
                    per_page: 100
                  }
                );

                let repoCount = 0;

                for (const commit of commits) {
                  const date =
                    commit.commit.author?.date ??
                    commit.commit.committer?.date;

                  if (!date) {
                    continue;
                  }

                  // 같은 commit SHA 중복 방지
                  if (!commitMap.has(commit.sha)) {
                    commitMap.set(commit.sha, date);
                    repoCount++;
                  }
                }

                core.info(
                  `${repo.fullName}: ${repoCount} commits`
                );

              } catch (error) {
                core.warning(
                  `Skipping ${repo.fullName}: ${error.message}`
                );
              }
            }

            const committedDates =
              [...commitMap.values()];

            core.info(
              `Total unique commits found: ${committedDates.length}`
            );

            if (committedDates.length === 0) {
              core.setFailed("No commits found.");
              return;
            }

            // 4. 시간대 계산
            let morning = 0;
            let daytime = 0;
            let evening = 0;
            let night = 0;

            const formatter =
              new Intl.DateTimeFormat("en-GB", {
                timeZone,
                hour: "2-digit",
                hourCycle: "h23"
              });

            for (const date of committedDates) {
              const hour =
                Number(
                  formatter.format(new Date(date))
                );

              if (hour >= 6 && hour < 12) {
                morning++;
              } else if (hour >= 12 && hour < 18) {
                daytime++;
              } else if (hour >= 18 && hour < 24) {
                evening++;
              } else {
                night++;
              }
            }

            const total =
              morning +
              daytime +
              evening +
              night;

            function generateBar(percent, size = 21) {
              const syms = "░▏▎▍▌▋▊▉█";

              const frac =
                Math.floor(
                  size * 8 * percent / 100
                );

              const full =
                Math.floor(frac / 8);

              if (full >= size) {
                return "█".repeat(size);
              }

              const semi = frac % 8;

              return (
                "█".repeat(full) +
                syms.substring(semi, semi + 1)
              ).padEnd(size, "░");
            }

            const periods = [
              ["🌞 Morning", morning],
              ["🌆 Daytime", daytime],
              ["🌃 Evening", evening],
              ["🌙 Night", night]
            ];

            const lines =
              periods.map(([label, commits]) => {
                const percent =
                  commits / total * 100;

                return [
                  label.padEnd(10),
                  `${String(commits).padStart(5)} commits`
                    .padEnd(14),
                  generateBar(percent),
                  `${percent.toFixed(1).padStart(5)}%`
                ].join(" ");
              });

            // 5. Gist 업데이트
            const gist =
              await github.rest.gists.get({
                gist_id: gistId
              });

            const oldFilename =
              Object.keys(gist.data.files)[0];

            const newFilename =
              morning + daytime >
              evening + night
                ? "I'm an early 🐤"
                : "I'm a night 🦉";

            await github.rest.gists.update({
              gist_id: gistId,

              files: {
                [oldFilename]: {
                  filename: newFilename,
                  content: lines.join("\n")
                }
              }
            });

            core.info(
              `Gist updated with ${total} commits 🎉`
            );
