name: Update gist

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Update gist
        uses: maxam2017/productive-box@master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TIMEZONE: Asia/Seoul
