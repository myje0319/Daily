// 2. 과거 모든 contribution year에서 저장소 수집
const yearsResponse = await github.graphql(`
  query($login: String!) {
    user(login: $login) {
      contributionsCollection {
        contributionYears
      }
    }
  }
`, {
  login: username
});

const years =
  yearsResponse.user.contributionsCollection.contributionYears;

core.info(`Contribution years: ${years.join(", ")}`);

const repoMap = new Map();

for (const year of years) {
  const from = `${year}-01-01T00:00:00Z`;
  const to = `${year}-12-31T23:59:59Z`;

  const result = await github.graphql(`
    query(
      $login: String!
      $from: DateTime!
      $to: DateTime!
    ) {
      user(login: $login) {
        contributionsCollection(
          from: $from
          to: $to
        ) {
          commitContributionsByRepository(
            maxRepositories: 100
          ) {
            repository {
              name
              nameWithOwner
              isFork
              owner {
                login
              }
            }
          }
        }
      }
    }
  `, {
    login: username,
    from,
    to
  });

  const items =
    result.user
      .contributionsCollection
      .commitContributionsByRepository;

  for (const item of items) {
    const repo = item.repository;

    if (!repo.isFork) {
      repoMap.set(repo.nameWithOwner, repo);
    }
  }
}

const repos = [...repoMap.values()];

core.info(`Historical repositories found: ${repos.length}`);
